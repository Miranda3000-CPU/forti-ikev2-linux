name: Build e release

# Gera os binários de distribuição e publica a GitHub Release em tags v*.
#
# A release é propositalmente enxuta — só o que o usuário final precisa:
#   FortiClient-VPN        executável único de Linux
#   install-linux.sh       instala dependências, sudoers e atalho do menu
#   FortiClient-VPN.exe    executável único de Windows (motor embutido)
#   README-DISTRIBUICAO    publicado como README.md
#   strongswan-*.tar.bz2   fonte do motor embutido no .exe (obrigação GPLv2)
#   SHA256SUMS             checksums
#
# Fluxo:
#   push/PR   -> testes + .deb (artefatos do Actions expiram em 90 dias;
#                para distribuir, use a Release de uma tag)
#   tag v*    -> os binários únicos, publicados como Release

on:
  # Sem `paths`: filtro de caminho também é avaliado em push de tag, e uma tag
  # normalmente não casa com nenhum caminho — a release acabaria nunca rodando.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Um build por vez: dois pushes seguidos não devem disputar o mesmo runner.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Padrão: só leitura. O job de release amplia para contents: write.
permissions:
  contents: read

env:
  # strongSwan embarcado no .exe do Windows é GPLv2: a release precisa publicar
  # o fonte correspondente. Manter em um só lugar, junto do NOTICE.
  STRONGSWAN_VERSION: "6.1.0"
  STRONGSWAN_SHA256: "fe6c97481298767213cfc2e9a1da29fdd8018d481ff4cb9cf0283099654f20d4"

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        # python3-yaml: lido por tests/test_distribution.py para conferir o
        # próprio workflow. A suíte pula o teste se o módulo faltar.
        run: sudo apt-get update -qq && sudo apt-get install -y python3-tk python3-yaml
      - name: Conferir a sincronia da versão
        run: |
          version="$(cat VERSION)"
          grep -qx "AppVersion=$version" build/FortiClient-VPN-Setup.iss \
            || { echo "::error::AppVersion do .iss divergiu de VERSION ($version). Rode: python3 build/gen_build_info.py"; exit 1; }
          grep -qx "Version: $version" debian/control \
            || { echo "::error::Version do debian/control divergiu de VERSION ($version). Rode: python3 build/gen_build_info.py"; exit 1; }
      - name: Nenhum segredo versionado
        run: |
          # config/forti.conf guarda PSK e senha do gateway: tem de estar
          # desversionado e ignorado, sempre.
          #
          # A ordem importa e o `if` é obrigatório: o shell do Actions roda com
          # `set -e`, e um `A && B` que termina em A-falhou aborta o passo.
          # Note que `git check-ignore` responde "não ignorado" para arquivo
          # versionado (o .gitignore não se aplica ao índice) — por isso o teste
          # de versionamento vem primeiro e dá a mensagem exata.
          if git ls-files --error-unmatch config/forti.conf 2>/dev/null; then
            echo "::error::config/forti.conf está versionado e contém PSK/senha do gateway. Remova do índice e rode a limpeza do histórico."
            exit 1
          fi
          git check-ignore -q config/forti.conf \
            || { echo "::error::config/forti.conf não está no .gitignore"; exit 1; }
          echo "ok: config/forti.conf ignorado e não versionado"
      - name: Rodar a suíte
        run: python3 -m unittest discover -s tests -v

  deb:
    name: Pacote Linux (.deb) [apenas CI]
    # O .deb continua sendo um caminho de instalação válido e é bom mantê-lo
    # compilando, mas NÃO é mais publicado na release: a distribuição passou a
    # ser o executável único + install-linux.sh.
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar
        run: ./build/build_deb.sh
      - name: Conferir o conteúdo do pacote
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          # Sem o ícone nos temas do sistema o atalho do menu aparece genérico.
          dpkg-deb --contents dist/*.deb | grep -q 'icons/hicolor/256x256/apps/forticlient-vpn.png' \
            || { echo "::error::ícone do hicolor ausente no pacote"; exit 1; }
          dpkg-deb --contents dist/*.deb | grep -q 'share/doc/forticlient-vpn/LICENSE' \
            || { echo "::error::LICENSE ausente no pacote"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  linux:
    name: Executável único (Linux)
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências do empacotamento
        run: pip install pyinstaller pillow
      - name: Gerar o executável
        run: ./build/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binario
          path: dist/FortiClient-VPN
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: install-linux
          path: install-linux.sh
          if-no-files-found: error

  windows:
    name: Executável único (Windows)
    # O .exe é autocontido: o motor strongSwan sai embutido no bundle e é
    # extraído para %LOCALAPPDATA% na primeira execução. Falha aqui bloqueia a
    # release — sem o .exe não há o que publicar para o Windows.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain do motor strongSwan (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            tar
            bzip2
            curl
            perl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkgconf

      - name: Compilar o motor strongSwan para Windows
        shell: msys2 {0}
        env:
          STRONGSWAN_VERSION: ${{ env.STRONGSWAN_VERSION }}
        run: bash build/build_strongswan_windows_msys2.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências do empacotamento
        run: pip install pyinstaller pillow

      - name: Versão e commit no pacote
        run: python build/gen_build_info.py

      - name: Conferir o motor vendorizado
        # O spec só embute vendor/windows se a pasta existir: sem esta checagem
        # um build sem o motor sairia silenciosamente e o .exe falharia em
        # campo com "Motor strongSwan não encontrado".
        shell: pwsh
        run: |
          foreach ($exe in @("charon-svc.exe", "swanctl.exe")) {
            if (-not (Test-Path "vendor\windows\$exe")) { throw "vendor\windows\$exe ausente" }
          }

      - name: Gerar o executável
        run: pyinstaller --noconfirm --distpath build/output --workpath build/output/work build/FortiClient-VPN.spec

      - name: Smoke test do executável
        # Garante que o bundle realmente extrai e roda (e não só que o
        # PyInstaller terminou).
        shell: pwsh
        run: |
          & "build\output\FortiClient-VPN.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "--help falhou com código $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binario
          path: build/output/FortiClient-VPN.exe
          if-no-files-found: error

  release:
    name: Publicar a release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Conferir que a tag bate com ./VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não corresponde a VERSION ($version). Atualize ./VERSION e a tag."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Preparar a pasta da release
        run: |
          # Só o que o usuário final precisa, e nada mais: nenhum .deb, nenhum
          # instalador, nenhum artefato de CI.
          cd release
          # O README do repositório é voltado a quem desenvolve; a release leva
          # o simplificado, focado em instalar e usar.
          cp "$GITHUB_WORKSPACE/README-DISTRIBUICAO.md" README.md
          ls -lh

      - name: Baixar o fonte do strongSwan (GPLv2)
        # O .exe do Windows embarca o motor strongSwan (GPLv2). Publicar o
        # binário sem o fonte correspondente viola a licença — por isso o
        # tarball acompanha a release, com o hash conferido contra o NOTICE.
        run: |
          version="${STRONGSWAN_VERSION}"
          curl -fL -o "release/strongswan-${version}.tar.bz2" \
            "https://download.strongswan.org/strongswan-${version}.tar.bz2"
          echo "${STRONGSWAN_SHA256}  release/strongswan-${version}.tar.bz2" | sha256sum -c -

      - name: Checksums
        run: |
          cd release
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          {
            echo "FortiClient VPN $version (DTIC) — cliente VPN IKEv2 para FortiGate."
            echo
            echo "| Sistema | Arquivo |"
            echo "| --- | --- |"
            echo "| Linux | \`FortiClient-VPN\` + \`install-linux.sh\` |"
            echo "| Windows | \`FortiClient-VPN.exe\` |"
            echo
            echo "**Linux:** \`chmod +x FortiClient-VPN install-linux.sh && ./install-linux.sh\`"
            echo "(instala o strongSwan, as regras do sudoers e o atalho do menu)."
            echo
            echo "**Windows:** execute \`FortiClient-VPN.exe\`. Na primeira execução o motor"
            echo "é extraído para \`%LOCALAPPDATA%\\FortiClientVPN\\engine\`. Sem assinatura de"
            echo "código, o SmartScreen avisa: **Mais informações → Executar assim mesmo**."
            echo
            echo "Confira a integridade com \`SHA256SUMS\`."
            echo
            echo "O .exe do Windows embarca o motor strongSwan (GPLv2); o fonte correspondente"
            echo "é o \`strongswan-${STRONGSWAN_VERSION}.tar.bz2\` desta release."
          } > notas.md
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "FortiClient VPN $version" \
            --notes-file notas.md
