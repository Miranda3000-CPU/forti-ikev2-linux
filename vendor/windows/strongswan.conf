# strongswan.conf — usado pelo charon-svc (serviço) e pelo swanctl.exe.
#
# IMPORTANTE (descoberto em campo): o swanctl resolve a pasta de configuração
# como o diretório DESTE arquivo. Ele aborta se não o encontrar. Por isso o
# aplicativo grava uma cópia deste arquivo junto com conf.d/ no diretório de
# configuração do usuário y roda o swanctl a partir de lá.
#
# O serviço (charon-svc) roda como SYSTEM na pasta do motor e usa esta cópia
# apenas para log. Quem carrega conexões/segredos é o aplicativo
# (swanctl --load-all).
#
# Atenção: o alvo do filelog NÃO pode conter ponto nem aspas — o parser do
# strongSwan rejeita as duas formas ("syntax error").
#
# `path` é obrigatório. Sem ele o bloco filelog não tem destino e o daemon
# não escreve log nenhum — o motivo real da falha de IKE some. O aplicativo
# regrava este arquivo com o path definitivo e reinicia o serviço, porque o
# charon-svc só lê a configuração no arranque.

charon-svc {
  # 2 = verboso. Sem isso o daemon só registra o essencial e o notify que
  # explica a falha fica de fora.
  loglevel = 2
  filelog {
    charonlog {
      path = C:/ProgramData/FortiClientVPN/charon.log
      flush_line = yes
      ike_name = yes
    }
  }
}
